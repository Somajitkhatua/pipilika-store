<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CampusConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center py-5" style="min-height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4 shadow-lg">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-primary">CampusConnect</h3>
                        <p class="text-muted">Sign in to your account</p>
                    </div>

                    <div id="error-alert" class="alert alert-danger d-none" role="alert"></div>

                    <form id="login-form">
                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <input type="email" id="email" class="form-control" required placeholder="name@example.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" required placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-muted">Don't have an account? <a href="register.html" class="text-primary text-decoration-none fw-bold">Register</a></p>
                        <a href="index.html" class="text-muted small text-decoration-none">← Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('error-alert');
            alertBox.classList.add('d-none');

            try {
                const response = await apiRequest('/auth/login', 'POST', { email, password }, false);
                localStorage.setItem('token', response.token);
                localStorage.setItem('role', response.role);
                localStorage.setItem('name', response.name);
                localStorage.setItem('email', response.email);
                localStorage.setItem('userId', response.userId);

                if (response.role === 'STUDENT') {
                    window.location.href = 'student/dashboard.html';
                } else if (response.role === 'RECRUITER') {
                    window.location.href = 'recruiter/dashboard.html';
                } else if (response.role === 'ADMIN') {
                    window.location.href = 'admin/dashboard.html';
                }
            } catch (err) {
                alertBox.textContent = err.message || 'Invalid email or password';
                alertBox.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
