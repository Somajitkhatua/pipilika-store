<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Opportunities - CampusConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-primary" href="../index.html"><i class="fa-solid fa-graduation-cap me-2"></i>CampusConnect</a>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block bg-white sidebar shadow-sm py-4" style="min-height: 90vh;">
                <ul class="nav flex-column">
                    <li class="nav-item mb-2"><a class="nav-link text-dark" href="dashboard.html"><i class="fa-solid fa-chart-line me-2"></i>Dashboard</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-dark" href="post-opportunity.html"><i class="fa-solid fa-plus-circle me-2"></i>Post Opportunity</a></li>
                    <li class="nav-item mb-2"><a class="nav-link active text-primary fw-bold" href="my-opportunities.html"><i class="fa-solid fa-briefcase me-2"></i>My Opportunities</a></li>
                </ul>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <h2 class="fw-bold mb-4">My Posted Opportunities</h2>

                <div class="card p-4">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Title</th>
                                    <th>Type</th>
                                    <th>Location</th>
                                    <th>Deadline</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="my-opps-tbody">
                                <!-- Loaded dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const opps = await apiRequest('/opportunities/my', 'GET');
                const tbody = document.getElementById('my-opps-tbody');
                if (!opps || opps.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No opportunities posted yet.</td></tr>';
                    return;
                }

                tbody.innerHTML = opps.map(opp => `
                    <tr>
                        <td class="fw-bold">${opp.title}</td>
                        <td><span class="badge bg-primary">${opp.type}</span></td>
                        <td>${opp.location} (${opp.workMode})</td>
                        <td>${opp.deadline || 'N/A'}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteOpportunity(${opp.id})"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        });

        async function deleteOpportunity(id) {
            if (confirm('Are you sure you want to delete this opportunity?')) {
                try {
                    await apiRequest(`/opportunities/${id}`, 'DELETE');
                    location.reload();
                } catch (err) {
                    alert('Failed to delete opportunity');
                }
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '../login.html';
        }
    </script>
</body>
</html>
