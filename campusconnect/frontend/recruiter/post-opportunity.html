<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Opportunity - CampusConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-primary" href="../index.html"><i class="fa-solid fa-graduation-cap me-2"></i>CampusConnect</a>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block bg-white sidebar shadow-sm py-4" style="min-height: 90vh;">
                <ul class="nav flex-column">
                    <li class="nav-item mb-2"><a class="nav-link text-dark" href="dashboard.html"><i class="fa-solid fa-chart-line me-2"></i>Dashboard</a></li>
                    <li class="nav-item mb-2"><a class="nav-link active text-primary fw-bold" href="post-opportunity.html"><i class="fa-solid fa-plus-circle me-2"></i>Post Opportunity</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-dark" href="my-opportunities.html"><i class="fa-solid fa-briefcase me-2"></i>My Opportunities</a></li>
                </ul>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <h2 class="fw-bold mb-4">Post New Opportunity</h2>

                <div id="alert-box" class="alert d-none"></div>

                <div class="card p-4">
                    <form id="post-opp-form">
                        <div class="mb-3">
                            <label class="form-label">Opportunity Title</label>
                            <input type="text" id="title" class="form-control" required placeholder="Java Developer Intern">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="description" class="form-control" rows="4" required placeholder="Detailed description of the role..."></textarea>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Type</label>
                                <select id="type" class="form-select">
                                    <option value="INTERNSHIP">Internship</option>
                                    <option value="FULL_TIME">Full Time</option>
                                    <option value="PART_TIME">Part Time</option>
                                    <option value="HACKATHON">Hackathon</option>
                                    <option value="WORKSHOP">Workshop</option>
                                    <option value="CERTIFICATION">Certification</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Work Mode</label>
                                <select id="workMode" class="form-select">
                                    <option value="REMOTE">Remote</option>
                                    <option value="HYBRID">Hybrid</option>
                                    <option value="ONSITE">Onsite</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Location</label>
                                <input type="text" id="location" class="form-control" placeholder="Bangalore / Remote">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Salary / Stipend</label>
                                <input type="text" id="salary" class="form-control" placeholder="₹25,000/month or ₹8 LPA">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Required Skills (comma separated)</label>
                            <input type="text" id="skillsRequired" class="form-control" required placeholder="Java, Spring Boot, MySQL, REST API">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Application Deadline</label>
                            <input type="date" id="deadline" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary px-4">Post Opportunity</button>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.getElementById('post-opp-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                type: document.getElementById('type').value,
                workMode: document.getElementById('workMode').value,
                location: document.getElementById('location').value,
                salary: document.getElementById('salary').value,
                skillsRequired: document.getElementById('skillsRequired').value,
                deadline: document.getElementById('deadline').value
            };

            const alertBox = document.getElementById('alert-box');
            try {
                await apiRequest('/opportunities', 'POST', payload);
                alertBox.className = 'alert alert-success';
                alertBox.textContent = 'Opportunity posted successfully!';
                alertBox.classList.remove('d-none');
                document.getElementById('post-opp-form').reset();
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = err.message || 'Failed to post opportunity';
                alertBox.classList.remove('d-none');
            }
        });

        function logout() {
            localStorage.clear();
            window.location.href = '../login.html';
        }
    </script>
</body>
</html>
