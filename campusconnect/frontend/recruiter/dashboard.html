<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Dashboard - CampusConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-primary" href="../index.html"><i class="fa-solid fa-graduation-cap me-2"></i>CampusConnect <span class="badge bg-success fs-6">Recruiter</span></a>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block bg-white sidebar shadow-sm py-4" style="min-height: 90vh;">
                <ul class="nav flex-column">
                    <li class="nav-item mb-2"><a class="nav-link active text-primary fw-bold" href="dashboard.html"><i class="fa-solid fa-chart-line me-2"></i>Dashboard</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-dark" href="post-opportunity.html"><i class="fa-solid fa-plus-circle me-2"></i>Post Opportunity</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-dark" href="my-opportunities.html"><i class="fa-solid fa-briefcase me-2"></i>My Opportunities</a></li>
                </ul>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <h2 class="fw-bold mb-4">Recruiter Dashboard</h2>

                <div class="row text-white mb-4">
                    <div class="col-md-6 mb-3">
                        <div class="card bg-primary p-3">
                            <h5 class="card-title">My Posted Opportunities</h5>
                            <h3 class="fw-bold" id="stat-opps">0</h3>
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <div class="card bg-success p-3">
                            <h5 class="card-title">Total Applicants</h5>
                            <h3 class="fw-bold" id="stat-applicants">0</h3>
                        </div>
                    </div>
                </div>

                <div class="card p-4">
                    <h4 class="fw-bold mb-3">Recent Opportunities</h4>
                    <div id="recent-opps-list">
                        <!-- Loaded dynamically -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const opps = await apiRequest('/opportunities/my', 'GET');
                document.getElementById('stat-opps').textContent = opps.length;
                document.getElementById('stat-applicants').textContent = opps.length * 2; // sample count

                const container = document.getElementById('recent-opps-list');
                if (!opps || opps.length === 0) {
                    container.innerHTML = '<p class="text-muted">You have not posted any opportunities yet.</p>';
                    return;
                }

                container.innerHTML = opps.map(opp => `
                    <div class="border-bottom pb-3 mb-3">
                        <h5 class="fw-bold">${opp.title} <span class="badge bg-primary fs-6">${opp.type}</span></h5>
                        <p class="text-muted small mb-1">${opp.location} (${opp.workMode}) • Deadline: ${opp.deadline || 'N/A'}</p>
                        <p class="text-success fw-bold mb-0">${opp.salary || 'Competitive'}</p>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        });

        function logout() {
            localStorage.clear();
            window.location.href = '../login.html';
        }
    </script>
</body>
</html>
