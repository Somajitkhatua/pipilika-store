<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Opportunities - CampusConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-primary" href="../index.html"><i class="fa-solid fa-graduation-cap me-2"></i>CampusConnect</a>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block bg-white sidebar shadow-sm py-4" style="min-height: 90vh;">
                <ul class="nav flex-column">
                    <li class="nav-item mb-2"><a class="nav-link text-dark" href="dashboard.html"><i class="fa-solid fa-chart-line me-2"></i>Dashboard</a></li>
                    <li class="nav-item mb-2"><a class="nav-link active text-primary fw-bold" href="opportunities.html"><i class="fa-solid fa-briefcase me-2"></i>Opportunities</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-dark" href="applications.html"><i class="fa-solid fa-file-lines me-2"></i>My Applications</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-dark" href="resume.html"><i class="fa-solid fa-robot me-2"></i>AI Resume Matcher</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-dark" href="profile.html"><i class="fa-solid fa-user me-2"></i>Profile</a></li>
                </ul>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <h2 class="fw-bold mb-4">Browse Opportunities</h2>

                <div class="input-group mb-4 shadow-sm bg-white p-2 rounded">
                    <input type="text" id="search-input" class="form-control border-0" placeholder="Search by skill or title...">
                    <button class="btn btn-primary px-4" onclick="searchOpp()"><i class="fa-solid fa-search"></i></button>
                </div>

                <div id="alert-box" class="alert d-none"></div>

                <div class="row" id="opportunities-grid">
                    <!-- Loaded dynamically -->
                </div>
            </main>
        </div>
    </div>

    <!-- Apply Modal -->
    <div class="modal fade" id="applyModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Apply for Opportunity</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modal-opportunity-id">
                    <div class="mb-3">
                        <label class="form-label">Cover Letter</label>
                        <textarea id="cover-letter" class="form-control" rows="4" placeholder="Why are you a good fit for this role?"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="submitApplication()">Submit Application</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        let applyModal;
        document.addEventListener('DOMContentLoaded', () => {
            applyModal = new bootstrap.Modal(document.getElementById('applyModal'));
            loadAllOpportunities();
        });

        async function loadAllOpportunities() {
            try {
                const opps = await apiRequest('/opportunities', 'GET', null, false);
                renderOpps(opps);
            } catch (err) {
                console.error(err);
            }
        }

        async function searchOpp() {
            const keyword = document.getElementById('search-input').value;
            try {
                const opps = await apiRequest(`/opportunities/search?keyword=${encodeURIComponent(keyword)}`, 'GET', null, false);
                renderOpps(opps);
            } catch (err) {
                console.error(err);
            }
        }

        function renderOpps(opps) {
            const grid = document.getElementById('opportunities-grid');
            if (!opps || opps.length === 0) {
                grid.innerHTML = '<p class="text-muted">No opportunities available.</p>';
                return;
            }

            grid.innerHTML = opps.map(opp => `
                <div class="col-md-6 mb-4">
                    <div class="card h-100 p-3">
                        <div class="card-body">
                            <span class="badge bg-primary mb-2">${opp.type}</span>
                            <h4 class="fw-bold">${opp.title}</h4>
                            <h6 class="text-muted mb-2">${opp.companyName} • ${opp.location} (${opp.workMode})</h6>
                            <p class="text-success fw-bold">${opp.salary || 'Competitive'}</p>
                            <p class="text-muted small">${opp.description}</p>
                            <div class="mb-3">
                                ${opp.skillsRequired.split(',').map(s => `<span class="badge-skill me-1 mb-1 d-inline-block">${s.trim()}</span>`).join('')}
                            </div>
                        </div>
                        <div class="card-footer bg-white border-0 d-flex gap-2">
                            <button class="btn btn-primary w-50" onclick="openApplyModal(${opp.id})">Apply Now</button>
                            <a href="resume.html?opportunityId=${opp.id}" class="btn btn-outline-secondary w-50">AI Match Check</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openApplyModal(opportunityId) {
            document.getElementById('modal-opportunity-id').value = opportunityId;
            document.getElementById('cover-letter').value = '';
            applyModal.show();
        }

        async function submitApplication() {
            const opportunityId = document.getElementById('modal-opportunity-id').value;
            const coverLetter = document.getElementById('cover-letter').value;
            const alertBox = document.getElementById('alert-box');

            try {
                await apiRequest(`/applications/${opportunityId}`, 'POST', { coverLetter });
                applyModal.hide();
                alertBox.className = 'alert alert-success';
                alertBox.textContent = 'Application submitted successfully!';
                alertBox.classList.remove('d-none');
            } catch (err) {
                applyModal.hide();
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = err.message || 'Failed to submit application';
                alertBox.classList.remove('d-none');
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '../login.html';
        }
    </script>
</body>
</html>
