<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Matcher - CampusConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-primary" href="../index.html"><i class="fa-solid fa-graduation-cap me-2"></i>CampusConnect</a>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block bg-white sidebar shadow-sm py-4" style="min-height: 90vh;">
                <ul class="nav flex-column">
                    <li class="nav-item mb-2"><a class="nav-link text-dark" href="dashboard.html"><i class="fa-solid fa-chart-line me-2"></i>Dashboard</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-dark" href="opportunities.html"><i class="fa-solid fa-briefcase me-2"></i>Opportunities</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-dark" href="applications.html"><i class="fa-solid fa-file-lines me-2"></i>My Applications</a></li>
                    <li class="nav-item mb-2"><a class="nav-link active text-primary fw-bold" href="resume.html"><i class="fa-solid fa-robot me-2"></i>AI Resume Matcher</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-dark" href="profile.html"><i class="fa-solid fa-user me-2"></i>Profile</a></li>
                </ul>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <h2 class="fw-bold mb-4"><i class="fa-solid fa-robot text-primary me-2"></i>AI Resume Skill Matcher</h2>

                <div class="card p-4 mb-4">
                    <h5 class="fw-bold mb-3">Select Opportunity to Analyze</h5>
                    <div class="row">
                        <div class="col-md-8 mb-3">
                            <select id="opportunity-select" class="form-select">
                                <option value="">Select an opportunity...</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <button class="btn btn-primary w-100" onclick="runAiMatch()">Analyze Match</button>
                        </div>
                    </div>
                </div>

                <div id="result-card" class="card p-4 d-none">
                    <h4 class="fw-bold mb-3">AI Analysis Results</h4>
                    <div class="row align-items-center mb-4">
                        <div class="col-md-4 text-center">
                            <div class="display-4 fw-bold text-primary" id="match-score">0%</div>
                            <p class="text-muted mb-0">Match Score</p>
                        </div>
                        <div class="col-md-8">
                            <h5 class="fw-bold">Matching Skills</h5>
                            <div id="matching-skills" class="mb-3"></div>
                            <h5 class="fw-bold">Missing Skills</h5>
                            <div id="missing-skills"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const opps = await apiRequest('/opportunities', 'GET', null, false);
                const select = document.getElementById('opportunity-select');
                opps.forEach(opp => {
                    const option = document.createElement('option');
                    option.value = opp.id;
                    option.textContent = `${opp.title} (${opp.companyName})`;
                    select.appendChild(option);
                });

                const urlParams = new URLSearchParams(window.location.search);
                const oppId = urlParams.get('opportunityId');
                if (oppId) {
                    select.value = oppId;
                    runAiMatch();
                }
            } catch (err) {
                console.error(err);
            }
        });

        async function runAiMatch() {
            const opportunityId = document.getElementById('opportunity-select').value;
            if (!opportunityId) {
                alert('Please select an opportunity');
                return;
            }

            try {
                const res = await apiRequest(`/resume/match/${opportunityId}`, 'GET');
                document.getElementById('match-score').textContent = res.matchScore + '%';
                
                const matchingContainer = document.getElementById('matching-skills');
                matchingContainer.innerHTML = res.matchingSkills.length > 0 
                    ? res.matchingSkills.map(s => `<span class="badge bg-success me-1 p-2">✓ ${s}</span>`).join('')
                    : '<span class="text-muted">None</span>';

                const missingContainer = document.getElementById('missing-skills');
                missingContainer.innerHTML = res.missingSkills.length > 0
                    ? res.missingSkills.map(s => `<span class="badge bg-danger me-1 p-2">✗ ${s}</span>`).join('')
                    : '<span class="text-success">None! Perfect match.</span>';

                document.getElementById('result-card').classList.remove('d-none');
            } catch (err) {
                console.error(err);
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '../login.html';
        }
    </script>
</body>
</html>
