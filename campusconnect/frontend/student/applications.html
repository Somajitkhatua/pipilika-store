<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications - CampusConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-primary" href="../index.html"><i class="fa-solid fa-graduation-cap me-2"></i>CampusConnect</a>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block bg-white sidebar shadow-sm py-4" style="min-height: 90vh;">
                <ul class="nav flex-column">
                    <li class="nav-item mb-2"><a class="nav-link text-dark" href="dashboard.html"><i class="fa-solid fa-chart-line me-2"></i>Dashboard</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-dark" href="opportunities.html"><i class="fa-solid fa-briefcase me-2"></i>Opportunities</a></li>
                    <li class="nav-item mb-2"><a class="nav-link active text-primary fw-bold" href="applications.html"><i class="fa-solid fa-file-lines me-2"></i>My Applications</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-dark" href="resume.html"><i class="fa-solid fa-robot me-2"></i>AI Resume Matcher</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-dark" href="profile.html"><i class="fa-solid fa-user me-2"></i>Profile</a></li>
                </ul>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <h2 class="fw-bold mb-4">My Applications</h2>

                <div class="card p-4">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Opportunity</th>
                                    <th>Company</th>
                                    <th>Applied Date</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="applications-table-body">
                                <!-- Loaded dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const apps = await apiRequest('/applications/my', 'GET');
                const tbody = document.getElementById('applications-table-body');
                if (!apps || apps.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">You have not applied for any opportunities yet.</td></tr>';
                    return;
                }

                tbody.innerHTML = apps.map(app => `
                    <tr>
                        <td class="fw-bold">${app.opportunity.title}</td>
                        <td>${app.opportunity.companyName}</td>
                        <td>${new Date(app.appliedAt).toLocaleDateString()}</td>
                        <td><span class="badge bg-${getStatusColor(app.status)}">${app.status}</span></td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        });

        function getStatusColor(status) {
            switch(status) {
                case 'APPLIED': return 'secondary';
                case 'UNDER_REVIEW': return 'info';
                case 'SHORTLISTED': return 'primary';
                case 'SELECTED': return 'success';
                case 'REJECTED': return 'danger';
                default: return 'secondary';
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '../login.html';
        }
    </script>
</body>
</html>
