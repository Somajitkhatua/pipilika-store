<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CampusConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-primary" href="../index.html"><i class="fa-solid fa-graduation-cap me-2"></i>CampusConnect <span class="badge bg-danger fs-6">Admin</span></a>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block bg-white sidebar shadow-sm py-4" style="min-height: 90vh;">
                <ul class="nav flex-column">
                    <li class="nav-item mb-2"><a class="nav-link active text-primary fw-bold" href="dashboard.html"><i class="fa-solid fa-chart-line me-2"></i>Dashboard</a></li>
                </ul>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <h2 class="fw-bold mb-4">Admin Dashboard</h2>

                <div class="row text-white mb-4">
                    <div class="col-md-4 mb-3">
                        <div class="card bg-primary p-3">
                            <h5 class="card-title">Total Students</h5>
                            <h3 class="fw-bold" id="stat-students">0</h3>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="card bg-success p-3">
                            <h5 class="card-title">Total Recruiters</h5>
                            <h3 class="fw-bold" id="stat-recruiters">0</h3>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="card bg-info p-3">
                            <h5 class="card-title">Total Opportunities</h5>
                            <h3 class="fw-bold" id="stat-opportunities">0</h3>
                        </div>
                    </div>
                </div>

                <div class="card p-4">
                    <h4 class="fw-bold mb-3">All Recruiters</h4>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Company Name</th>
                                    <th>Website</th>
                                    <th>Location</th>
                                    <th>Verified</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="recruiters-tbody">
                                <!-- Loaded dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const stats = await apiRequest('/admin/dashboard', 'GET');
                document.getElementById('stat-students').textContent = stats.totalStudents;
                document.getElementById('stat-recruiters').textContent = stats.totalRecruiters;
                document.getElementById('stat-opportunities').textContent = stats.totalOpportunities;

                const recruiters = await apiRequest('/admin/recruiters', 'GET');
                const tbody = document.getElementById('recruiters-tbody');
                if (!recruiters || recruiters.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No recruiters found.</td></tr>';
                    return;
                }

                tbody.innerHTML = recruiters.map(rec => `
                    <tr>
                        <td class="fw-bold">${rec.companyName}</td>
                        <td><a href="${rec.website}" target="_blank">${rec.website || 'N/A'}</a></td>
                        <td>${rec.location || 'N/A'}</td>
                        <td><span class="badge bg-${rec.verified ? 'success' : 'warning'}">${rec.verified ? 'Verified' : 'Pending'}</span></td>
                        <td>
                            <button class="btn btn-sm btn-outline-success me-1" onclick="verifyRecruiter(${rec.id}, true)">Approve</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="verifyRecruiter(${rec.id}, false)">Reject</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        });

        async function verifyRecruiter(id, approve) {
            try {
                await apiRequest(`/admin/recruiters/${id}/verify?approve=${approve}`, 'PUT');
                location.reload();
            } catch (err) {
                alert('Failed to update recruiter status');
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '../login.html';
        }
    </script>
</body>
</html>
