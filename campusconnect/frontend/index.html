<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect - Student Opportunity & Placement Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">
                <i class="fa-solid fa-graduation-cap me-2"></i>CampusConnect
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center" id="nav-auth-links">
                    <li class="nav-item me-3"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="btn btn-primary text-white" href="register.html">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero-section text-center">
        <div class="container">
            <h1 class="display-4 fw-bold mb-3">Find Your Next Big Opportunity</h1>
            <p class="lead mb-4">Discover internships, full-time jobs, hackathons, and workshops tailored for your career.</p>
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="input-group mb-3 shadow-lg rounded-pill bg-white p-2">
                        <input type="text" id="search-input" class="form-control border-0 shadow-none px-3" placeholder="Search by title, skill (e.g. Java, React, Python)...">
                        <button class="btn btn-primary rounded-pill px-4" type="button" id="search-btn"><i class="fa-solid fa-search me-2"></i>Search</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Opportunities Container -->
    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold">Featured Opportunities</h3>
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-outline-primary active" onclick="filterType('ALL')">All</button>
                <button type="button" class="btn btn-outline-primary" onclick="filterType('INTERNSHIP')">Internships</button>
                <button type="button" class="btn btn-outline-primary" onclick="filterType('FULL_TIME')">Full Time</button>
                <button type="button" class="btn btn-outline-primary" onclick="filterType('HACKATHON')">Hackathons</button>
            </div>
        </div>

        <div class="row" id="opportunities-list">
            <!-- Dynamically Loaded Opportunities -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 CampusConnect. Built with Java Spring Boot & Bootstrap.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const role = localStorage.getItem('role');
            if (token && role) {
                const navAuth = document.getElementById('nav-auth-links');
                let dashUrl = '#';
                if (role === 'STUDENT') dashUrl = 'student/dashboard.html';
                else if (role === 'RECRUITER') dashUrl = 'recruiter/dashboard.html';
                else if (role === 'ADMIN') dashUrl = 'admin/dashboard.html';

                navAuth.innerHTML = `
                    <li class="nav-item me-3"><a class="btn btn-outline-primary" href="${dashUrl}">Dashboard</a></li>
                    <li class="nav-item"><button class="btn btn-danger btn-sm text-white" onclick="logout()">Logout</button></li>
                `;
            }

            loadOpportunities();

            document.getElementById('search-btn').addEventListener('click', () => {
                const keyword = document.getElementById('search-input').value;
                searchOpportunities(keyword);
            });
        });

        async function loadOpportunities() {
            try {
                const opportunities = await apiRequest('/opportunities', 'GET', null, false);
                renderOpportunities(opportunities);
            } catch (err) {
                console.error(err);
            }
        }

        async function searchOpportunities(keyword) {
            try {
                const opportunities = await apiRequest(`/opportunities/search?keyword=${encodeURIComponent(keyword)}`, 'GET', null, false);
                renderOpportunities(opportunities);
            } catch (err) {
                console.error(err);
            }
        }

        function renderOpportunities(opportunities) {
            const container = document.getElementById('opportunities-list');
            if (!opportunities || opportunities.length === 0) {
                container.innerHTML = '<p class="text-center text-muted">No opportunities found.</p>';
                return;
            }

            container.innerHTML = opportunities.map(opp => `
                <div class="col-md-4 mb-4">
                    <div class="card h-100 p-3">
                        <div class="card-body">
                            <span class="badge bg-primary mb-2">${opp.type}</span>
                            <h5 class="card-title fw-bold">${opp.title}</h5>
                            <h6 class="card-subtitle mb-2 text-muted">${opp.companyName}</h6>
                            <p class="card-text text-muted small"><i class="fa-solid fa-location-dot me-1"></i>${opp.location} (${opp.workMode})</p>
                            <p class="card-text fw-bold text-success">${opp.salary || 'Competitive'}</p>
                            <div class="mb-3">
                                ${opp.skillsRequired.split(',').map(s => `<span class="badge-skill me-1 mb-1 d-inline-block">${s.trim()}</span>`).join('')}
                            </div>
                        </div>
                        <div class="card-footer bg-white border-0">
                            <a href="login.html" class="btn btn-outline-primary w-100">View & Apply</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
